<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Недоступно</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0b0f14;
    color: #e8eef5;
    font: 500 26px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6vw;
  }
  .box { max-width: 720px; }
  h1 { font-size: clamp(32px, 6vw, 64px); margin: 0 0 16px; letter-spacing: -.02em; }
  p { color: #9fb3c8; font-size: clamp(18px, 2.4vw, 28px); margin: 0; }
</style>
</head>
<body>
  <div class="box">
    <h1>Страница временно недоступна</h1>
    <p>Загляните позже.</p>
  </div>
</body>
</html>
